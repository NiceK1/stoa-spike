<text x="120.0" y="964.0" font-size="13" fill="#52514e" font-weight="400" text-anchor="end">of 40</text>
<path d="M132.0,934.0 H286.1 a4,4 0 0 1 4,4 v4.0 a4,4 0 0 1 -4,4 H132.0 Z" fill="#a8a69d"/>
<text x="297.1" y="945.5" font-size="14" fill="#0b0b0b" font-weight="400" text-anchor="start">17 of 40</text>
