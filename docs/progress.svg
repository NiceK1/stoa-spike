<text x="511.0" y="961.5" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start">40 of 40</text>
<text x="20.0" y="1025.0" font-size="14" fill="#0b0b0b" font-weight="400" text-anchor="start">All 14 raster misses are counting errors of the detectors or the vision model, not misread</text>
<text x="20.0" y="1044.0" font-size="14" fill="#0b0b0b" font-weight="400" text-anchor="start">questions. In total 103 of 250 before, 236 of 250 after. One interpretation costs about 0.0007</text>
<text x="20.0" y="1063.0" font-size="14" fill="#0b0b0b" font-weight="400" text-anchor="start">USD (0.70 USD per 1,000 questions).</text>
